name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sit Break 120-5 ${{ github.ref_name }}'
          releaseBody: 'Windows 10/11 x64。WebView2 Runtimeが必要です。手動受け入れ確認後に公開してください。'
          releaseDraft: true
          prerelease: true
      - name: Portable distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path src-tauri/target/release/sit-break.exe,LICENSE,NOTICE,README.md -DestinationPath sit-break-120-5-portable.zip
          gh release upload ${{ github.ref_name }} sit-break-120-5-portable.zip
