<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sit Break 設定</title><link rel="stylesheet" href="/src/ui.css"></head><body><main class="settings"><p class="eyebrow">SIT BREAK</p><h1>設定</h1><form id="form"><fieldset id="fields"><label class="field" for="work">作業時間 <span><input id="work" type="number" min="1" max="1440" step="1" required> 分</span></label><label class="field" for="rest">休憩時間 <span><input id="rest" type="number" min="1" max="180" step="1" required> 分</span></label><label class="check"><input id="sound" type="checkbox">通知音を鳴らす</label><label class="check"><input id="autostart" type="checkbox">Windows起動時に自動起動</label><p class="small muted">作業時間を変更すると、変更後の時間で最初から計り直します。休憩中は設定を変更できません。</p><button type="submit">保存する</button></fieldset><p id="message" role="status"></p><p id="error" class="error" role="alert"></p></form></main><script type="module" src="/src/settings.ts"></script></body></html>
